    .secret-trigger {

    .secret-trigger:hover { color: #9a9a9a; border-bottom-color: #d0d0d0; }

    .secret-panel {

    .cookie-output .cookie-close {

      padding: 2px 6px; border-radius: 6px; transition: 0.15s;
    }
    .cookie-output .cookie-close:hover { background: #e0e0e2; color: #333; }

    .footer { margin-top: clamp(40px, 10vw, 60px); font-size: clamp(12px, 3vw, 14px); color: #999; text-align: center; padding: 0 10px; }

    @media (max-width: 360px) {

      .secret-panel button { background: #2a2a2a; border-color: #444; color: #bbb; }
      .secret-panel button:hover { background: #333; color: #ddd; }

  <script>
    (function() {
      document.getElementById('year').textContent = new Date().getFullYear();

      const trigger = document.getElementById('secretTrigger');
      const panel = document.getElementById('secretPanel');
      const input = document.getElementById('secretInput');
      const submit = document.getElementById('secretSubmit');
      const errorEl = document.getElementById('secretError');
      const serverBtnWrap = document.getElementById('serverBtnWrap');

      // cookie 相关
      const cookieBtn = document.getElementById('cookieBtn');
      const cookieOutput = document.getElementById('cookieOutput');
      const cookieBody = document.getElementById('cookieBody');
      const cookieClose = document.getElementById('cookieClose');

      trigger.addEventListener('click', function(e) {
        e.stopPropagation();
        if (serverBtnWrap.classList.contains('show')) return;
        panel.classList.toggle('show');
        if (panel.classList.contains('show')) {
          input.focus();
          errorEl.textContent = '';
        }
      });

      function checkPassword() {
        const pwd = input.value.trim();
        if (pwd === '114514') {
          errorEl.textContent = '';
          panel.classList.remove('show');
          serverBtnWrap.classList.add('show');
          trigger.style.display = 'none';
          input.value = '';
        } else {
          errorEl.textContent = '密码错误，请重试';
          input.value = '';
          input.focus();
        }
      }

      submit.addEventListener('click', checkPassword);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          checkPassword();
        }
      });

      document.addEventListener('click', function(e) {
        if (panel.classList.contains('show')) {
          const isClickInside = panel.contains(e.target) || trigger.contains(e.target);
          if (!isClickInside) {
            panel.classList.remove('show');
            errorEl.textContent = '';
          }
        }
      });

      /* ========== cookie 按钮逻辑 ========== */
      cookieBtn.addEventListener('click', function() {
        // 切换显示
        if (cookieOutput.classList.contains('show')) {
          cookieOutput.classList.remove('show');
          return;
        }
        cookieOutput.classList.add('show');
        cookieBody.textContent = '加载中…';

        // 加时间戳避免浏览器缓存
        fetch('cookie.txt?t=' + Date.now())
          .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
            return res.text();
          })
          .then(function(text) {
            cookieBody.textContent = text || '(文件为空)';
          })
          .catch(function(err) {
            cookieBody.textContent = '错误：' + err.message;
          });
      });

      // 关闭 cookie 输出
      cookieClose.addEventListener('click', function(e) {
        e.stopPropagation();
        cookieOutput.classList.remove('show');
      });
    })();
  </script>
